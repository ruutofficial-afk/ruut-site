name: Deploy to Hostinger

# Trigger: runs on every push to the 'main' branch
on:
  push:
    branches:
      - main

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy-site:
    name: Deploy Frontend & Ruut Plugin via FTP
    runs-on: ubuntu-latest
    environment: FTP_HOST

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Clean non-deployable metadata to make FTP transfer fast
      - name: Clean build workspace
        run: |
          rm -rf .git .github project-brain scratch *.py reconstructed_ruut_core* *.md

      # Deploy frontend files + ruut-core plugin to Hostinger via FTP using lftp
      # Uses FTP_SERVER_DIR secret if defined, defaulting to public_html/
      - name: Deploy via FTP
        run: |
          sudo apt-get update && sudo apt-get install -y lftp

          TARGET_DIR="${{ secrets.FTP_SERVER_DIR }}"
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR="public_html/"
          fi

          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set net:timeout 15;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_HOST }}';
            
            mirror --reverse --verbose \
              --exclude-glob 'wp-admin/*' \
              --exclude-glob 'wp-includes/*' \
              --exclude-glob 'wp-content/*' \
              --exclude-glob 'wp-config.php' \
              --exclude-glob '*.mp4' \
              ./ \"${TARGET_DIR}\";

            mirror --reverse --verbose \
              ./wp-content/plugins/ruut-core/ \"${TARGET_DIR}wp-content/plugins/ruut-core/\";

            quit;
          "
          echo "Frontend & Ruut Plugin deployment complete!"
