name: Deploy Frontend to Hostinger

# Trigger: runs on every push to the 'main' branch
on:
  push:
    branches:
      - main

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend Files via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Deploy ONLY frontend files to Hostinger via FTP using lftp
      # This NEVER touches wp-admin, wp-includes, wp-content, wp-config.php
      - name: Deploy via FTP
        run: |
          sudo apt-get install -y lftp

          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" ${{ secrets.FTP_HOST }} <<EOF
          set ftp:ssl-allow no
          set mirror:exclude-regex (\.git|project-brain|scratch|\.github|\.mp4$|\.py$|reconstructed_ruut_core|design\.md|architecture\.md|DEVELOPER_HANDOFF\.md|landing\ page\ image)
          
          # Upload HTML files
          mput -O ${{ secrets.FTP_SERVER_DIR }} *.html
          mput -O ${{ secrets.FTP_SERVER_DIR }} .htaccess
          mput -O ${{ secrets.FTP_SERVER_DIR }} index.php
          
          # Mirror assets directory (only uploads changed files)
          mirror --reverse --verbose --only-newer assets ${{ secrets.FTP_SERVER_DIR }}assets
          
          bye
          EOF
          echo "Frontend deploy complete!"

  deploy-backend-plugin:
    name: Deploy Backend Plugin via FTP
    runs-on: ubuntu-latest

    # Only run when commit message contains [deploy-backend] or manual trigger
    if: >-
      contains(github.event.head_commit.message, '[deploy-backend]') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Plugin via FTP
        run: |
          sudo apt-get install -y lftp

          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" ${{ secrets.FTP_HOST }} <<EOF
          set ftp:ssl-allow no
          
          # Mirror only the ruut-core plugin directory
          mirror --reverse --verbose --only-newer wp-content/plugins/ruut-core ${{ secrets.FTP_SERVER_DIR }}wp-content/plugins/ruut-core
          
          bye
          EOF
          echo "Backend plugin deploy complete!"
