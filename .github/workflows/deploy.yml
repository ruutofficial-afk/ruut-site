name: Deploy Frontend to Hostinger

# Trigger: runs on every push to the 'main' branch
on:
  push:
    branches:
      - main

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend Files via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Deploy ONLY frontend files to Hostinger via FTP using lftp
      # This NEVER touches wp-admin, wp-includes, wp-content, wp-config.php
      - name: Deploy via FTP
        run: |
          sudo apt-get update && sudo apt-get install -y lftp

          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set net:timeout 15;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_HOST }}';
            
            mirror --reverse --only-newer --verbose \
              --exclude-glob '.git*' \
              --exclude-glob 'project-brain/*' \
              --exclude-glob 'scratch/*' \
              --exclude-glob '.github/*' \
              --exclude-glob 'wp-admin/*' \
              --exclude-glob 'wp-includes/*' \
              --exclude-glob 'wp-content/*' \
              --exclude-glob 'wp-config.php' \
              --exclude-glob '*.mp4' \
              --exclude-glob '*.py' \
              --exclude-glob 'reconstructed_ruut_core*' \
              --exclude-glob '*.md' \
              ./ '${{ secrets.FTP_SERVER_DIR }}';
            quit;
          "
          echo "Frontend deploy complete!"

  deploy-backend-plugin:
    name: Deploy Backend Plugin via FTP
    runs-on: ubuntu-latest

    # Only run when commit message contains [deploy-backend] or manual trigger
    if: >-
      contains(github.event.head_commit.message, '[deploy-backend]') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Plugin via FTP
        run: |
          sudo apt-get update && sudo apt-get install -y lftp

          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set net:timeout 15;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_HOST }}';
            
            mirror --reverse --only-newer --verbose \
              ./wp-content/plugins/ruut-core/ '${{ secrets.FTP_SERVER_DIR }}wp-content/plugins/ruut-core/';
            quit;
          "
          echo "Backend plugin deploy complete!"
